.wrap{width:min(100%,500px);margin:auto}

.tag{

}
.links{display:grid;gap:12px}
.link{

  border:1px solid #303030;border-radius:17px;
  background:linear-gradient(180deg,#1a1a1a,#111);
  color:#fff;text-decoration:none;
  font-weight:800;font-size:15px;
  transition:.18s ease;
}
.link:hover{transform:translateY(-2px);border-color:#d71920;box-shadow:0 8px 24px rgba(215,25,32,.16)}
.icon{
  width:32px;height:32px;display:grid;place-items:center;

}
.icon svg{width:27px;height:27px;display:block;fill:currentColor}
.link span:last-child{flex:1;text-align:center;margin-right:32px}
.ig{color:#ff4d78}.wa{color:#25d366}.fb{color:#4d8dff}
.tt{color:#fff}.maps{color:#4d90fe}.review{color:#fbbc04}
.cta{
  margin-top:20px;text-align:center;font-size:11px;
  color:#777;letter-spacing:.8px
}
@media(max-width:380px){.card{padding:22px 14px}.logo{width:165px;height:165px}h1{font-size:25px}}
